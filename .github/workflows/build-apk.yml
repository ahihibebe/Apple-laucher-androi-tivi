name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Giai nen
        run: unzip -q "$(ls *.zip | head -1)"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.9
      - name: Build APK
        working-directory: VietLauncher
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v6
        with:
          name: VietLauncher-apk
          path: VietLauncher/app/build/outputs/apk/debug/*.apk
